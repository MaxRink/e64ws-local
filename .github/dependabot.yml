version: 2

# Dependabot covers every manifest in this repository that declares
# dependencies.
#
# The repository's own tooling is deliberately standard-library-only, but it
# still has manifests: the reimplementation's requirements, the Android Gradle
# build, two Dockerfiles and the local-cloud compose stack. Alerts and
# automated security fixes are enabled at repository level; this file is what
# makes version updates arrive too.
#
# Deliberately absent, with the reason:
#   - swift, both packages: tools/vm-app/Package.swift and
#     apps/ios/GrinderCore/Package.swift declare no dependencies;
#   - gomod: tools/mqttd/go.mod imports the standard library only and has no
#     require block, although the module is cross-built per
#     docs/bible/operations.md;
#   - npm, pub, gitsubmodule and devcontainers: this repository has no
#     package.json, pubspec.yaml, .gitmodules or devcontainer.json.
#
# Six dependencies are deliberately held rather than left out; two of them are
# suppressed here so they cannot reopen, because moving them is a re-baseline and
# not an update:
#
#   suppressed - ubuntu in /tools/rebuild/buildroot/docker, and the postgres
#                major in /deploy/local-cloud. Each entry's own comment says why.
#   not suppressed, documented instead - php (8.4, matched to the device's
#                8.4.16), eclipse-temurin (21, the documented Android/Ghidra
#                toolchain), swift (6.3, the pin the iOS probe is declared
#                against) and debian (12, the dev-env base). These should still
#                arrive as PRs and be answered, not hidden.
#
# All six are recorded in docs/DEPENDENCY_AUDIT.md with the registry version that
# was NOT adopted and the evidence for the hold. Everything not in that list
# tracks the registry.

updates:
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      python-tools:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /tools/reimpl
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      python-reimpl:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Minor and patch arrive grouped; a major (including the Android Gradle
    # plugin, which Dependabot names by its bare plugin id com.android.application)
    # stays a single ungrouped PR so the SDK platform can move with it.
    groups:
      android-gradle:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker/dev-env
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /tools/rebuild/buildroot/docker
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Not a dependency to keep current: this Dockerfile is the host that produced
    # the digests in tools/rebuild/buildroot/results/. On 26.04 its apt list has
    # no qemu-user-static candidate, and GCC 15.2 / Python 3.14 / make 4.4 move
    # the CRT objects those digests consist of, so a bump is a re-baseline of the
    # study, not an update. Without this, #34 reopens. The cost is written down
    # in docs/REPRODUCIBLE_BUILDS.md, "Deliberately pinned".
    ignore:
      # Dependabot names this dependency "ubuntu" for FROM ubuntu:22.04, not the
      # Docker Hub repository path library/ubuntu: #34 reports
      # package-manager=docker&dependency-name=ubuntu and titles itself
      # "Bump ubuntu from 22.04 to 26.04". 22.04 -> 26.04 parses as a major
      # update and 22.04 -> 22.10 as a minor one, so both are excluded and
      # neither an LTS nor an interim release can reopen it.
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker-compose
    directory: /deploy/local-cloud
    schedule:
      interval: weekly
      day: monday
      time: "05:50"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # postgres is held at 18.7 while 19.0 exists.  19.0 has no point release,
    # db is an unused template, and 19 moves PGDATA to
    # /var/lib/postgresql/19/docker so every existing 18 cluster becomes as
    # unreachable as a 16 one.  Moving majors is a dump-and-restore path, not a
    # tag bump - deploy/local-cloud/README.md "Upgrading from 16" prices it, and
    # docs/DEPENDENCY_AUDIT.md records the decision.  Only the major is
    # suppressed, so 18.x patch releases still arrive.
    ignore:
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
