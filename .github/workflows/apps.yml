name: apps

# The app code was only ever verified by hand. The first two jobs are the gate:
# the iOS core is Foundation-only and runs on a stock macOS runner, and the
# Android unit tests need a JDK and the SDK command-line tools, not an emulator.
#
# ios-e2e and android-e2e wrap tools/e2e/run_apps_e2e.py, the same harness a
# developer runs: it starts tools/e64ws_simulator.py on free loopback ports and
# points the app at it, so the suites exercise the real HTTP stack instead of a
# stub. Both keep the JSON report as an artifact.
#
# android-instrumented drives the Compose ActionsE2E test on a KVM emulator. It
# is slow enough that it stays behind workflow_dispatch and never gates a push.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "tools/e2e/**"
      - "tools/e64ws_simulator.py"
      - "tools/e64ws_simulator_ui.html"
      - "tools/requirements.txt"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/**"
      - "tools/e2e/**"
      - "tools/e64ws_simulator.py"
      - "tools/e64ws_simulator_ui.html"
      - "tools/requirements.txt"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-core:
    name: iOS core checks
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Report the toolchain
        run: swift --version
      - name: Build every target, including the E2E executable
        working-directory: apps/ios/GrinderCore
        run: swift build
      - name: Run the portable checks
        working-directory: apps/ios/GrinderCore
        run: swift run GrinderCoreChecks

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install the platform the app compiles against
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0" >/dev/null
      - name: Run the JVM tests
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload the test report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: apps/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  ios-e2e:
    name: iOS live E2E
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the simulator's two dependencies
        run: pip install -r tools/requirements.txt
      - name: Run the suite against the simulator
        run: python3 tools/e2e/run_apps_e2e.py --only ios --json /tmp/ios-e2e.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-report
          path: /tmp/ios-e2e.json
          if-no-files-found: ignore

  android-e2e:
    name: Android live E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install the platform the app compiles against
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the simulator's two dependencies
        run: pip install -r tools/requirements.txt
      - name: Run the suite against the simulator
        run: python3 tools/e2e/run_apps_e2e.py --only android --json /tmp/android-e2e.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-report
          path: /tmp/android-e2e.json
          if-no-files-found: ignore

  android-instrumented:
    name: Android instrumented E2E (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install the platform and the image the AVD boots from
        run: sdkmanager "platforms;android-35" "system-images;android-35;google_apis;x86_64" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the Compose test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cd apps/android
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=de.mahlkoenig.e64local.ActionsE2E
