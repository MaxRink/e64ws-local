# Local-only, LAN-only owner app. No analytics, no crash reporting, no vendor
# cloud: nothing in this project contacts a host that is not the user-entered
# device.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# Compose is compiled by the Kotlin compose compiler plugin; no resource
# indexing or Compose-Resources artifacts are used.
android.disableResourceValidation=true
kotlin.code.style=official
