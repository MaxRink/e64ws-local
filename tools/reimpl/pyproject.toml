[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e64ctl"
version = "1.0.0"
description = "Clean-room reimplementation of the Mahlkoenig E64 WS control service"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
tls = ["cryptography>=42"]

[project.scripts]
e64ctl = "e64ctl.main:main"

[tool.setuptools.packages.find]
where = ["src"]
